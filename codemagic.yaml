# MYD-IVMS iOS 未签名 ipa —— Codemagic 云构建（2026-11-06）
# 依赖改用 CocoaPods（官方 MobileVLCKit spec；原 SPM 镜像仓库已失效 404）。
# 流程：brew xcodegen → 生成 .xcodeproj → pod install 生成 .xcworkspace →
#       xcodebuild -workspace archive（未签名）→ Payload zip 成 ipa → artifacts 下载。
workflows:
  ios-unsigned:
    name: iOS Unsigned IPA
    max_build_duration: 40
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: cd ios && xcodegen generate
      - name: Pod install (MobileVLCKit)
        script: |
          cd ios
          pod install --repo-update
          ls -lh MYDIVMS.xcworkspace
      - name: Archive (unsigned)
        script: |
          cd ios
          xcodebuild archive \
            -workspace MYDIVMS.xcworkspace \
            -scheme MYDIVMS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MYDIVMS.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > /tmp/xcb.log 2>&1
          XCODE_EXIT=$?
          echo "===== 汇总所有编译错误 ====="
          grep -E "error:" /tmp/xcb.log | sort -u | head -60
          echo "===== 构建结论 ====="
          grep -E "FAILED|SUCCEEDED" /tmp/xcb.log | tail -3
          echo "===== xcodebuild 退出码：$XCODE_EXIT ====="
          if [ $XCODE_EXIT -ne 0 ]; then
            echo "❌ 编译失败（见上方 error 汇总）"
            exit 1
          fi
      - name: Package unsigned IPA
        script: |
          if [ ! -d ios/build/MYDIVMS.xcarchive/Products/Applications/MYDIVMS.app ]; then
            echo "❌ .app 产物不存在——Archive 步骤实际失败了，不能打空包"
            exit 1
          fi
          mkdir -p ios/build/Payload
          cp -R ios/build/MYDIVMS.xcarchive/Products/Applications/MYDIVMS.app ios/build/Payload/
          cd ios/build
          zip -qry MYDIVMS-unsigned.ipa Payload
          SIZE=$(stat -f%z MYDIVMS-unsigned.ipa)
          echo "ipa 大小：$SIZE 字节"
          if [ $SIZE -lt 100000 ]; then
            echo "❌ ipa 过小，打包异常"
            exit 1
          fi
          ls -lh MYDIVMS-unsigned.ipa
    artifacts:
      - ios/build/MYDIVMS-unsigned.ipa
    publishing:
      email:
        recipients:
          - q364294124@example.com
        notify:
          success: true
          failure: true
